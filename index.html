<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2026 Discipline Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
body {
  background:#0d0d0d; color:#e1e1e1;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-size:12px; height:100dvh; overflow:hidden; display:flex; flex-direction:column;
}

/* Landscape Lock Overlay */
#rotate-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: #000000; z-index: 99999; flex-direction: column;
  justify-content: center; align-items: center; text-align: center; color: #fff; padding: 20px;
}
#rotate-overlay div { font-size: 40px; margin-bottom: 15px; animation: spin 2s infinite ease-in-out; }
#rotate-overlay p { font-size: 14px; font-weight: 600; color: #4af08c; margin-bottom: 15px; }
#rotate-btn { background: #1e3a29; border: 1px solid #4af08c; color: #fff; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
@keyframes spin { 0% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } 100% { transform: rotate(0deg); } }

@media screen and (max-width: 768px) and (orientation: portrait) {
  #rotate-overlay { display: flex !important; }
}

/* Header */
.header {
  background:#141414; border-bottom:1px solid #222; padding:6px 12px;
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0; gap:6px; flex-wrap:wrap;
}
.header-title { font-size:13px; font-weight:700; color:#fff; letter-spacing:0.5px; display:flex; align-items:center; gap:6px; }
.header-title span { color:#4a9e6e; }

.btn-group { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.btn-tool { background:#1e1e1e; color:#ccc; border:1px solid #2c2c2c; padding:5px 10px; font-size:11px; font-weight:600; border-radius:6px; cursor:pointer; transition:all 0.2s; }
.btn-tool:hover { background:#2a2a2a; color:#fff; }
.btn-month-select { background:#1a2736; color:#5e9fe8; border-color:#2a3f5a; font-weight:700; }
.btn-month-select:hover { background:#24364a; color:#82b7f5; }
.btn-undo { background:#331d10; color:#f0a04b; border-color:#522e1a; display:none; }
.btn-undo.active { display:inline-block; }
.btn-add { background:#192e1d; color:#52c472; border-color:#264a2e; }
.btn-noti { background:#262619; color:#ffd700; border-color:#4d4700; }
.btn-demo { background:#162e20; color:#4af08c; border-color:#214a30; }

/* Main Layout */
.main-container { display:flex; flex:1; overflow:hidden; position:relative; }
.left-panel { flex:1; overflow:auto; background:#0d0d0d; }

.right-panel {
  width:320px; min-width:280px; background:#121212; border-left:1px solid #1f1f1f;
  overflow-y:auto; display:flex; flex-direction:column; transition: all 0.35s ease;
}
.right-panel.panel-hidden { opacity: 0 !important; width: 0 !important; min-width: 0 !important; padding: 0 !important; border: none !important; pointer-events: none !important; }

/* Table Grid - Tinh chỉnh đường kẻ mềm mại */
.tracker-table { border-collapse:collapse; min-width:100%; table-layout:fixed; }
.tracker-table th, .tracker-table td { border:1px solid #1c1c1c; text-align:center; padding:0; }
.th-month { background:#161616; color:#4a9e6e; font-weight:800; font-size:12px; padding:6px; width:220px; position:sticky; left:0; z-index:10; border-right:2px solid #2a2a2a; }
.th-day-name { background:#121212; color:#555; font-size:8px; font-weight:600; width:28px; height:20px; }
.th-day-num { background:#0f0f0f; color:#777; font-size:9px; width:28px; height:20px; }

.habit-name {
  background:#141414; color:#ddd; font-size:11px; text-align:left; padding:2px 5px;
  position:sticky; left:0; z-index:4; border-right:2px solid #282828; height:36px; width:220px;
  display:flex; align-items:center; gap:4px;
}
.habit-input { background:transparent; border:1px solid transparent; color:#ddd; font-size:10px; flex:1; outline:none; padding:2px 4px; border-radius:4px; }
.habit-input:focus { border-color:#4a9e6e; background:#1e1e1e; }

/* Nút sắp xếp & xóa */
.btn-order { background:#222; color:#777; border:none; border-radius:3px; width:16px; height:16px; font-size:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.btn-order:hover { background:#333; color:#fff; }
.btn-del-task { background:transparent; color:#555; border:none; width:18px; height:18px; font-size:10px; cursor:pointer; border-radius:3px; }
.btn-del-task:hover { color:#ff5555; background:#221313; }

/* CHECKBOX TỰ THIẾT KẾ BO TRÒN - KHÔNG DÙNG MẶC ĐỊNH */
.cb-cell { width:28px; height:36px; padding:0; vertical-align:middle; transition: background 0.15s ease; }
.cb-cell.cb-today { background:#10172a !important; }
.cb-cell.cb-done { background:#0b1d12 !important; }

.cb-cell input[type=checkbox] {
  appearance: none;
  -webkit-appearance: none;
  width: 17px;
  height: 17px;
  border-radius: 5px;
  border: 1px solid #333;
  background: #161616;
  cursor: pointer;
  margin: 0 auto;
  display: block;
  position: relative;
  transition: all 0.15s ease;
}
.cb-cell input[type=checkbox]:hover {
  border-color: #4a9e6e;
}
.cb-cell input[type=checkbox]:checked {
  background: #4a9e6e;
  border-color: #4a9e6e;
  box-shadow: 0 0 6px rgba(74, 158, 110, 0.4);
}
.cb-cell input[type=checkbox]:checked::after {
  content: '✓';
  position: absolute;
  color: #ffffff;
  font-size: 11px;
  font-weight: 900;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* Widgets Right Panel */
.rpanel { border-bottom:1px solid #1f1f1f; padding:10px; }
.rp-title { font-size:10px; font-weight:700; color:#888; text-align:center; background:#161616; padding:4px; border-radius:4px; margin-bottom:8px; border:1px solid #222; }
.chart-box { position:relative; height:105px; width:100%; }
.stats-wrap { display:flex; gap:10px; align-items:center; }
.stats-col { flex:1; display:flex; flex-direction:column; gap:4px; }
.stat-row { display:flex; justify-content:space-between; align-items:center; background:#161616; padding:4px 8px; border-radius:4px; border-left:3px solid #444; }
.stat-row.s-goal { border-color:#5e9fe8; }
.stat-row.s-done { border-color:#4a9e6e; }
.stat-row.s-left { border-color:#de9255; }
.stat-label { font-size:9px; color:#777; font-weight:600; }
.stat-val { font-size:12px; font-weight:700; color:#fff; }
.donut-wrap { position:relative; width:75px; height:75px; flex-shrink:0; }
.donut-label { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:13px; font-weight:800; color:#fff; }

/* YEAR OVERVIEW MODAL (BẢNG NĂM 2026) */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(6px);
  z-index: 10000; justify-content: center; align-items: center; padding: 15px;
}
.modal-overlay.active { display: flex; }

.year-box {
  background: #141414; border: 1px solid #2c2c2c; border-radius: 12px;
  width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto;
  padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  display: flex; flex-direction: column; gap: 14px;
}
.year-header {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid #222; padding-bottom: 10px;
}
.year-title { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
.year-title span { color: #4a9e6e; }
.close-btn { background: #222; border: 1px solid #444; color: #aaa; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.close-btn:hover { background: #333; color: #fff; }

.months-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
@media (max-width: 550px) {
  .months-grid { grid-template-columns: repeat(3, 1fr); }
}

.month-card {
  background: #181818; border: 1px solid #262626; border-radius: 10px;
  padding: 12px 8px; display: flex; flex-direction: column; align-items: center;
  gap: 8px; cursor: pointer; transition: all 0.2s ease;
}
.month-card:hover {
  border-color: #4a9e6e; background: #202020; transform: translateY(-2px);
}
.month-card.active {
  border-color: #4a9e6e; background: #16261b; box-shadow: 0 0 12px rgba(74, 158, 110, 0.3);
}
.month-card-name { font-size: 12px; font-weight: 700; color: #ddd; }

/* Ring phần trăm bao quanh */
.ring-container {
  position: relative; width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.ring-inner {
  position: absolute; width: 44px; height: 44px; border-radius: 50%;
  background: #181818; display: flex; flex-direction: column;
  align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff;
}
.month-card:hover .ring-inner { background: #202020; }
.month-card.active .ring-inner { background: #16261b; }
.ring-subtext { font-size: 8px; color: #888; font-weight: 600; margin-top: -2px; }
</style>
</head>
<body>

<!-- xoay màn hình -->
<div id="rotate-overlay">
  <div>📱 ➔ 📲</div>
  <p>Vui lòng xoay ngang màn hình để có trải nghiệm tốt nhất!</p>
  <button id="rotate-btn" onclick="forceLandscape()">Xoay Ngang Ngay</button>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-title">🎯 <span>2026</span> TRACKER</div>
  <div class="btn-group">
    <button class="btn-tool btn-month-select" id="curMonthBtn" onclick="openYearModal()">📅 Tháng 10 / 2026 ▾</button>
    <button class="btn-tool btn-undo" id="undoBtn" onclick="undoLastAction()">↩️ Hoàn tác</button>
    <button class="btn-tool btn-add" onclick="addNewHabit()">➕ Thêm Nhiệm Vụ</button>
    <button class="btn-tool btn-noti" onclick="enableLockscreenChecklist()">🔔 Thông Báo Màn Khóa</button>
    <button class="btn-tool" onclick="toggleStats()"><span id="statsBtnTxt">📊 Thống Kê</span></button>
    <button class="btn-tool btn-demo" onclick="loadDemoData()">🎲 Demo</button>
  </div>
</div>

<div class="main-container">
  <div class="left-panel" id="left-panel"></div>
  
  <div class="right-panel panel-hidden" id="right-panel">
    <!-- 1. THỐNG KÊ NGÀY -->
    <div class="rpanel">
      <div class="rp-title">📅 DAILY PROGRESS (%)</div>
      <div class="chart-box"><canvas id="cDaily"></canvas></div>
    </div>

    <!-- 2. THỐNG KÊ TUẦN -->
    <div class="rpanel">
      <div class="rp-title">📆 WEEKLY PROGRESS (%)</div>
      <div class="chart-box"><canvas id="cWeekly"></canvas></div>
    </div>

    <!-- 3. THỐNG KÊ TỔNG QUAN -->
    <div class="rpanel">
      <div class="rp-title">🎯 OVERALL STATS</div>
      <div class="stats-wrap">
        <div class="stats-col">
          <div class="stat-row s-goal"><span class="stat-label">Goal</span><span class="stat-val" id="sGoal">0</span></div>
          <div class="stat-row s-done"><span class="stat-label">Done</span><span class="stat-val" id="sDone">0</span></div>
          <div class="stat-row s-left"><span class="stat-label">Left</span><span class="stat-val" id="sLeft">0</span></div>
        </div>
        <div class="donut-wrap">
          <canvas id="cDonut" width="75" height="75"></canvas>
          <div class="donut-label" id="dPct">0%</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- BẢNG TỔNG QUAN NĂM 2026 (MODAL) -->
<div class="modal-overlay" id="yearModal">
  <div class="year-box">
    <div class="year-header">
      <div class="year-title">🗓️ BẢNG TỔNG QUAN <span>NĂM 2026</span></div>
      <button class="close-btn" onclick="closeYearModal()">✕</button>
    </div>
    <div class="months-grid" id="monthsGrid"></div>
  </div>
</div>

<script>
const YEAR = 2026;
const MONTHS = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
const DAYS_SHORT = ['Su','Mo','Tu','We','Th','Fr','Sa'];

const DEFAULT_HABITS = [
  { id: 'h1', name: '⏰ Dậy 06:00 AM' },
  { id: 'h2', name: '🇬🇧 Học Tiếng Anh (3.5h)' },
  { id: 'h3', name: '📖 Học Bài trên lớp (2h)' },
  { id: 'h4', name: '💻 Học Chuyên ngành CS' },
  { id: 'h5', name: '🏋️ Tập Gym (1h)' },
  { id: 'h6', name: '💤 Ngủ trưa (30p-1h)' },
  { id: 'h7', name: '📵 MXH (Tối đa 2h)' },
  { id: 'h8', name: '😴 Ngủ 23:00' }
];

const SK = 'ht2026_dynamic_v3';
let M = new Date().getFullYear() === YEAR ? new Date().getMonth() : 9;
let DATA = {};
let HABITS = [];
let undoStack = [];
let swRegistration = null;

try { 
  DATA = JSON.parse(localStorage.getItem(SK) || '{}'); 
  HABITS = DATA.habits && DATA.habits.length > 0 ? DATA.habits : [...DEFAULT_HABITS];
} catch(e){ HABITS = [...DEFAULT_HABITS]; }

function save(){ 
  DATA.habits = HABITS;
  DATA.last_saved_date = getTodayString();
  localStorage.setItem(SK, JSON.stringify(DATA)); 
  updateLockscreenNotification();
  updateUndoButton();
}

function pushUndoState(description) {
  undoStack.push({
    habits: JSON.parse(JSON.stringify(HABITS)),
    data: JSON.parse(JSON.stringify(DATA)),
    desc: description
  });
  if (undoStack.length > 20) undoStack.shift();
  updateUndoButton();
}

function undoLastAction() {
  if (undoStack.length === 0) return;
  const lastState = undoStack.pop();
  HABITS = lastState.habits;
  DATA = lastState.data;
  save();
  renderTable();
  updateAll();
  updateUndoButton();
}

function updateUndoButton() {
  const btn = document.getElementById('undoBtn');
  if (undoStack.length > 0) {
    btn.classList.add('active');
    btn.title = `Hoàn tác: ${undoStack[undoStack.length - 1].desc}`;
  } else {
    btn.classList.remove('active');
  }
}

function getTodayString(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function daysInMonth(m){ return new Date(YEAR, m+1, 0).getDate(); }
function dayDow(m,d){ return new Date(YEAR, m, d).getDay(); }
function cbKey(m,d,hid){ return `${YEAR}-${m}-${d}-${hid}`; }

function computeMonthPct(m) {
  const days = daysInMonth(m);
  const hLen = HABITS.length || 1;
  const totalPossible = days * hLen;
  let doneCount = 0;

  for(let d=1; d<=days; d++){
    HABITS.forEach(h => {
      if(DATA[cbKey(m, d, h.id)]) doneCount++;
    });
  }
  return totalPossible > 0 ? Math.round((doneCount / totalPossible) * 100) : 0;
}

function openYearModal() {
  const grid = document.getElementById('monthsGrid');
  grid.innerHTML = '';

  MONTHS.forEach((name, i) => {
    const pct = computeMonthPct(i);
    const card = document.createElement('div');
    card.className = 'month-card' + (i === M ? ' active' : '');
    card.onclick = () => selectMonth(i);

    card.innerHTML = `
      <div class="month-card-name">${name}</div>
      <div class="ring-container" style="background: conic-gradient(#4a9e6e ${pct}%, #282828 0deg);">
        <div class="ring-inner">
          ${pct}%
          <span class="ring-subtext">XONG</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  document.getElementById('yearModal').classList.add('active');
}

function closeYearModal() {
  document.getElementById('yearModal').classList.remove('active');
}

function selectMonth(m) {
  M = m;
  closeYearModal();
  updateHeaderButton();
  renderTable();
  updateAll();
}

function updateHeaderButton() {
  document.getElementById('curMonthBtn').textContent = `📅 ${MONTHS[M]} / 2026 ▾`;
}

function moveHabit(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= HABITS.length) return;
  
  pushUndoState('Sắp xếp vị trí nhiệm vụ');
  const temp = HABITS[idx];
  HABITS[idx] = HABITS[newIdx];
  HABITS[newIdx] = temp;
  
  save();
  renderTable();
}

function deleteHabit(idx) {
  if (!confirm(`Bạn có chắc muốn xóa nhiệm vụ "${HABITS[idx].name}"?`)) return;
  
  pushUndoState(`Xóa nhiệm vụ "${HABITS[idx].name}"`);
  HABITS.splice(idx, 1);
  
  save();
  renderTable();
  updateAll();
}

function addNewHabit() {
  const name = prompt('Nhập tên nhiệm vụ mới:');
  if (!name || !name.trim()) return;

  pushUndoState('Thêm nhiệm vụ mới');
  const newId = 'h_' + Date.now();
  HABITS.push({ id: newId, name: name.trim() });

  save();
  renderTable();
  updateAll();
}

async function forceLandscape() {
  try {
    if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen().catch(()=>{});
    if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
    document.getElementById('rotate-overlay').style.display = 'none';
  } catch (err) {}
}
window.addEventListener('load', forceLandscape);

async function initServiceWorker() {
  if ('serviceWorker' in navigator) {
    try {
      swRegistration = await navigator.serviceWorker.register('sw.js');
      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data && event.data.type === 'TOGGLE_HABIT_FROM_NOTI') {
          const hid = event.data.hid;
          const today = new Date();
          if (today.getFullYear() === YEAR) {
            const m = today.getMonth();
            const d = today.getDate();
            pushUndoState('Đánh dấu từ thông báo');
            DATA[cbKey(m, d, hid)] = true;
            save(); renderTable(); updateAll();
          }
        }
      });
    } catch (e) {}
  }
}
initServiceWorker();

async function enableLockscreenChecklist() {
  if (!('Notification' in window)) return alert('❌ Trình duyệt không hỗ trợ Thông báo!');
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    alert('✅ ĐÃ KÍCH HOẠT THÔNG BÁO!');
    updateLockscreenNotification();
  } else {
    alert('❌ Bạn chưa cấp quyền thông báo.');
  }
}

function updateLockscreenNotification() {
  if (Notification.permission !== 'granted') return;
  const today = new Date();
  if (today.getFullYear() !== YEAR) return;

  const m = today.getMonth();
  const d = today.getDate();
  const uncompleted = HABITS.filter(h => !DATA[cbKey(m, d, h.id)]);

  const title = uncompleted.length === 0 
    ? '🎉 Hoàn thành xuất sắc!' 
    : `🎯 Tiến trình Hôm nay (${HABITS.length - uncompleted.length}/${HABITS.length})`;

  const bodyText = uncompleted.length === 0 
    ? 'Bạn đã hoàn thành tất cả công việc!' 
    : `Còn ${uncompleted.length} việc chưa làm:\n` + uncompleted.map(h => `• ${h.name}`).join('\n');

  const actions = uncompleted.slice(0, 2).map(h => ({ action: `check_${h.id}`, title: `✅ ${h.name}` }));

  if (swRegistration && swRegistration.active) {
    swRegistration.showNotification(title, {
      body: bodyText,
      icon: 'https://cdn-icons-png.flaticon.com/512/2683/2683274.png',
      tag: 'discipline-tracker-tag',
      renotify: true,
      requireInteraction: true,
      actions: actions
    });
  }
}

function renderTable(){
  const days = daysInMonth(M);
  const today = new Date();
  const isCurMon = (today.getFullYear() === YEAR && today.getMonth() === M);
  const todayD = today.getDate();

  let h = '<table class="tracker-table"><thead><tr><th class="th-month">'+MONTHS[M].toUpperCase()+'</th>';
  for(let d=1; d<=days; d++){ h += `<th class="th-day-name">${DAYS_SHORT[dayDow(M,d)]}</th>`; }
  h += '</tr><tr>';
  for(let d=1; d<=days; d++){
    const todayCls = (isCurMon && d === todayD) ? ' style="color:#7799ff;font-weight:800"' : '';
    h += `<th class="th-day-num"${todayCls}>${d}</th>`;
  }
  h += '</tr></thead><tbody>';

  HABITS.forEach((hb, idx) => {
    h += `<tr><td class="habit-name">
      <button class="btn-order" onclick="moveHabit(${idx}, -1)" title="Lên">▲</button>
      <button class="btn-order" onclick="moveHabit(${idx}, 1)" title="Xuống">▼</button>
      <input type="text" class="habit-input" value="${hb.name}" data-idx="${idx}">
      <button class="btn-del-task" onclick="deleteHabit(${idx})" title="Xóa nhiệm vụ">🗑️</button>
    </td>`;

    for(let d=1; d<=days; d++){
      const key = cbKey(M,d,hb.id);
      const chk = DATA[key] ? 'checked' : '';
      const isToday = (isCurMon && d === todayD);
      const isDone = !!DATA[key];
      let cls = 'cb-cell' + (isToday ? ' cb-today' : isDone ? ' cb-done' : '');
      h += `<td class="${cls}"><input type="checkbox" data-k="${key}" ${chk}></td>`;
    }
    h += '</tr>';
  });
  h += '</tbody></table>';

  document.getElementById('left-panel').innerHTML = h;

  document.querySelectorAll('.habit-input').forEach(el => {
    el.addEventListener('change', function(){
      const idx = this.dataset.idx;
      if (HABITS[idx] && HABITS[idx].name !== this.value) {
        pushUndoState(`Đổi tên nhiệm vụ thành "${this.value}"`);
        HABITS[idx].name = this.value;
        save();
      }
    });
  });

  document.querySelectorAll('[data-k]').forEach(el => {
    el.addEventListener('change', function(){
      pushUndoState('Đánh dấu tích chọn');
      DATA[this.dataset.k] = this.checked;
      save(); updateAll();
    });
  });
}

function computeStats(){
  const days = daysInMonth(M);
  const dailyPct = [];
  const hLen = HABITS.length || 1;

  for(let d=1; d<=days; d++){
    let done = 0;
    HABITS.forEach(h => { if(DATA[cbKey(M,d,h.id)]) done++; });
    dailyPct.push(Math.round((done / hLen) * 100));
  }

  const weeklyPct = [];
  const weekLabels = [];
  let wDone = 0, wTotal = 0, wCount = 1;

  for(let d=1; d<=days; d++){
    HABITS.forEach(h => { 
      wTotal++;
      if(DATA[cbKey(M,d,h.id)]) wDone++; 
    });

    if(d % 7 === 0 || d === days) {
      const pct = wTotal > 0 ? Math.round((wDone / wTotal) * 100) : 0;
      weeklyPct.push(pct);
      weekLabels.push(`W${wCount}`);
      wCount++;
      wDone = 0; wTotal = 0;
    }
  }

  const totalGoal = days * hLen;
  const totalDone = dailyPct.reduce((s, v) => s + Math.round((v * hLen)/100), 0);

  return { dailyPct, weeklyPct, weekLabels, totalGoal, totalDone, days };
}

let cD, cW, cDo;
function initCharts(){
  const s = computeStats();

  cD = new Chart(document.getElementById('cDaily'), {
    type:'bar',
    data:{ labels: Array.from({length:s.days}, (_,i) => i+1), datasets:[{ data: s.dailyPct, backgroundColor: '#4a9e6e', borderRadius: 2 }] },
    options:{ 
      responsive:true, 
      maintainAspectRatio:false, 
      plugins:{ legend:{display:false} }, 
      scales:{ 
        x:{ 
          ticks:{ maxRotation: 0, minRotation: 0, font:{ size:8 }, color:'#777' }, 
          grid:{ display:false } 
        }, 
        y:{ min:0, max:100, ticks:{ font:{ size:9 }, color:'#777' }, grid:{ color:'#1f1f1f' } } 
      } 
    }
  });

  cW = new Chart(document.getElementById('cWeekly'), {
    type:'bar',
    data:{ labels: s.weekLabels, datasets:[{ data: s.weeklyPct, backgroundColor: '#5e9fe8', borderRadius: 3 }] },
    options:{ 
      responsive:true, 
      maintainAspectRatio:false, 
      plugins:{ legend:{display:false} }, 
      scales:{ 
        x:{ ticks:{ font:{ size:9 }, color:'#777' }, grid:{ display:false } }, 
        y:{ min:0, max:100, ticks:{ font:{ size:9 }, color:'#777' }, grid:{ color:'#1f1f1f' } } 
      } 
    }
  });

  cDo = new Chart(document.getElementById('cDonut'), {
    type:'doughnut',
    data:{ datasets:[{ data:[0, 100], backgroundColor:['#4a9e6e','#1e1e1e'], borderWidth:0 }] },
    options:{ responsive:false, cutout:'70%', plugins:{ legend:{display:false} } }
  });
}

function updateAll(){
  const s = computeStats();
  cD.data.labels = Array.from({length:s.days}, (_,i) => i+1);
  cD.data.datasets[0].data = s.dailyPct; 
  cD.update();

  cW.data.labels = s.weekLabels;
  cW.data.datasets[0].data = s.weeklyPct; 
  cW.update();

  const pct = s.totalGoal > 0 ? Math.round((s.totalDone / s.totalGoal) * 100) : 0;
  cDo.data.datasets[0].data = [pct, 100-pct]; 
  cDo.update();

  document.getElementById('sGoal').textContent = s.totalGoal;
  document.getElementById('sDone').textContent = s.totalDone;
  document.getElementById('sLeft').textContent = s.totalGoal - s.totalDone;
  document.getElementById('dPct').textContent = pct + '%';
}

function toggleStats(){ document.getElementById('right-panel').classList.toggle('panel-hidden'); }
function loadDemoData(){
  pushUndoState('Tải dữ liệu Demo');
  for(let d=1; d<=daysInMonth(M); d++){ HABITS.forEach(h => DATA[cbKey(M,d,h.id)] = Math.random() < 0.7); }
  save(); renderTable(); updateAll();
}

updateHeaderButton();
renderTable();
initCharts();
updateUndoButton();
</script>
